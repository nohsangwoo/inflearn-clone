<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>링구스트 HLS 재생 테스트</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7faf9;
        color: #101820;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(960px, calc(100vw - 32px));
      }

      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0f172a;
        border-radius: 8px;
      }

      p {
        margin: 12px 0 0;
        color: #475569;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <video id="video" controls muted playsinline></video>
      <p id="status">loading</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.12/dist/hls.min.js"></script>
    <script>
      const video = document.getElementById("video");
      const status = document.getElementById("status");
      const source = "/hls-demo/lingoost-sample/master.m3u8";

      function setStatus(message) {
        status.textContent = message;
      }

      video.addEventListener("loadeddata", () => {
        setStatus(`loadeddata ${video.videoWidth}x${video.videoHeight}`);
      });
      video.addEventListener("canplay", () => {
        setStatus(`canplay ${video.duration.toFixed(2)}s`);
      });
      video.addEventListener("error", () => {
        setStatus("video error");
      });

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true });
        hls.loadSource(source);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus("manifest parsed");
          video.play().catch(() => undefined);
        });
        hls.on(Hls.Events.ERROR, (_event, data) => {
          setStatus(`hls error ${data.type} ${data.details}`);
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = source;
      } else {
        setStatus("hls unsupported");
      }
    </script>
  </body>
</html>
